name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swiftpm:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: brew install xcbeautify
      - name: Build with Swift Package Manager
        run: ./Scripts/test-swiftpm.sh

  cocoapods:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: brew install cocoapods xcbeautify
      - name: Prepare binary podspecs
        run: git clone --depth 1 https://github.com/FeliksLv01/RichTextViewBinaries.git ../RichTextViewBinaries
      - name: Validate with CocoaPods
        run: ./Scripts/test-cocoapods.sh
